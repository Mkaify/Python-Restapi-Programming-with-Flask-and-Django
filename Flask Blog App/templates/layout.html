<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='main.css') }}">
    <title>
        {% if title %}
            Everything Blog - {{ title }}
        {% else %}
            Everything Blog
        {% endif %}
    </title>
</head>
<body>
    <div class="site-header">
        <nav class="navbar navbar-dark bg-dark navbar-expand-md" style="font-size:1.1em">
            <div class="container">
                <a class="navbar-brand" href="/">Everything Blog</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarToggle" aria-controls="navbarToggle" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarToggle">
                    <ul class="navbar-nav mr-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                        </li>
                    </ul>
                    <!-- Navbar Right Side -->
                    <div class="navbar-nav">
                        <a class="nav-item nav-link" href="{{ url_for('register') }}">Register</a>
                    </div>
                </div>
            </div>
        </nav>
    </div>
    <main role="main" class="container mt-4">
        <div class="row">
            <div class="col-lg-9 mx-auto">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                          <span aria-hidden="true">&times;</span>
                        </button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>
    <footer class="site-footer py-4 mt-5">
        <div class="container text-center text-muted">
            <div class="mb-2">
                <a class="footer-link" href="{{ url_for('home') }}">Home</a>
                <span class="mx-2">•</span>
                <a class="footer-link" href="{{ url_for('register') }}">Register</a>
                <span class="mx-2">•</span>
                <a class="footer-link" href="{{ url_for('login') }}">Login</a>
            </div>
            <small>© {{ 2025 }} Everything Blog</small>
        </div>
    </footer>
    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc2e/u77E0lZr2Roa6qUBe5gk5OFb1p8UXBz/UqP8" crossorigin="anonymous"></script>
</body>
</html>
